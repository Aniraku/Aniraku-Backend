server:
  host: 127.0.0.1
  port: 43211
  ui_dist: ""
  debug: false

supabase:
  url: ${ANIRAKU_SUPABASE_URL}
  anon_key: ${ANIRAKU_SUPABASE_ANON_KEY}
  service_key: ${ANIRAKU_SUPABASE_SERVICE_KEY}
  jwt_aud: authenticated
  # jwks_url is derived by the server from supabase.url as
  # {url}/auth/v1/.well-known/jwks.json — the correct Supabase path.
  # Set ANIRAKU_SUPABASE_JWKS_URL only to override.

logging:
  level: info
  format: json

update:
  channel: stable
  url: https://api.aniraku.app/update
